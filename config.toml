baseURL = "https://zeroasterisk.com"
languageCode = "en-us"
title = "Alan Blount | Member of Technical Staff / TPM at Google"

# Modern Hugo configuration
paginate = 10
theme = "minimal-tech"
canonifyURLs = true
enableRobotsTXT = true
enableEmoji = true

# Hugo build settings
buildDrafts = false
buildExpired = false
buildFuture = false

# Permalinks - clean URLs
[permalinks]
  posts = "/:year/:month/:slug/"
  personal = "/personal/:year/:month/:slug/"

# Taxonomies
[taxonomies]
  tag = "tags"
  
# Main menu
[[menu.main]]
  identifier = "tech"
  name = "Tech"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "personal"
  name = "Personal"
  url = "/personal/"
  weight = 20

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 30

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 35

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 40

# Site parameters
[params]
  description = "Member of Technical Staff / Technical Product Manager at Google. Agent security, governance, capabilities, quality, and evaluation. Lead author of the Kaggle Introduction to Agents whitepaper."
  
  # Author info
  author = "Alan Blount"
  job = "Member of Technical Staff / Technical Product Manager at Google"
  location = "Boulder, CO"
  
  # Social links
  github = "zeroasterisk"
  twitter = "zeroasterisk"
  linkedin = "alanblount"
  email = "alan@zeroasterisk.com"
  
  # Site settings
  show_reading_time = true
  show_word_count = false
  show_last_modified = true
  
  # Professional focus areas
  focus_areas = ["AI Agent Systems", "Memory Architectures", "LLMOps", "Agentic Runtimes", "Developer Tools"]
  
  # Analytics
  googleAnalytics = "UA-2011466-1"
  
  # Content organization
  highlight_work = true
  minimal_style = true